<header><b><span>Calcul mental · bases de 6<sup>e</sup></span></b><span id="profbadge" hidden>mode professeur</span><span id="syncst" hidden></span>
<button data-nav="home">Accueil</button><button data-nav="progress">Ma progression</button><button data-nav="flags" hidden>Signalements</button></header>
<main id="app"></main>
<script src="config.js"></script>
<script>
/* ===== Générateurs de calculs ===== */
const R = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const NB = ' ';

function fmt(x) {
  let r = Math.round(x * 1e6) / 1e6, neg = r < 0; r = Math.abs(r);
  let s = String(r);
  if (/e/.test(s)) s = r.toFixed(6).replace(/0+$/, '').replace(/\.$/, '');
  let [i, d] = s.split('.');
  if (i.length >= 4) i = i.replace(/\B(?=(\d{3})+(?!\d))/g, NB);
  return (neg ? '−' : '') + i + (d ? ',' + d : '');
}
/* expression ASCII (ex. "6+9*4") -> affichage français */
function show(e) {
  return e.replace(/\d+(\.\d+)?/g, m => fmt(parseFloat(m)))
    .replace(/\*/g, ' × ').replace(/\//g, ' ÷ ').replace(/\+/g, ' + ').replace(/-/g, ' − ');
}
function ev(e) { return Math.round(Function('"use strict";return (' + e + ')')() * 1e6) / 1e6; }
const fr = (n, d) => '<span class="frac"><span>' + n + '</span><span>' + d + '</span></span>';
const blank = '<span class="blank">…</span>';
const N = fmt;

/* Fabrique une question « calcul » à partir d'une expression */
function calc(expr, sol, prefix) {
  return { q: (prefix || 'Calculer : ') + show(expr), kind: 'num', ans: ev(expr), expr, sol };
}

/* ---------- 1. Tables et divisions ---------- */
const T_TABLES = [
  { id: 'tables.mult', nom: 'Table de multiplication', gen() {
    const a = R(3, 9), b = R(3, 9);
    return calc(a + '*' + b, a + ' × ' + b + ' = ' + a * b + '.');
  } },
  { id: 'tables.div', nom: 'Division par une table', gen() {
    const a = R(3, 9), b = R(3, 9);
    return calc((a * b) + '/' + a, 'On cherche le nombre qui, multiplié par ' + a + ', donne ' + a * b + ' : ' + a + ' × ' + b + ' = ' + a * b + ', donc ' + a * b + ' ÷ ' + a + ' = ' + b + '.');
  } },
  { id: 'tables.trou', nom: 'Compléter une multiplication', gen() {
    const a = R(3, 9), b = R(3, 9);
    return { q: 'Compléter : ' + a + ' × ' + blank + ' = ' + N(a * b), kind: 'num', ans: b,
      sol: a + ' × ' + b + ' = ' + a * b + '.' };
  } },
  { id: 'tables.reste', nom: 'Reste d’une division euclidienne', gen() {
    const b = R(3, 9), q = R(3, 9), r = R(1, b - 1), n = b * q + r;
    return { q: 'Quel est le reste de la division euclidienne de ' + n + ' par ' + b + ' ?', kind: 'num', ans: r,
      sol: b + ' × ' + q + ' = ' + b * q + ' et ' + n + ' − ' + b * q + ' = ' + r + '. Le reste est ' + r + ' (il est plus petit que ' + b + ').' };
  } },
  { id: 'tables.multiple', nom: 'Vrai ou faux : multiple', gen() {
    const a = pick([3, 4, 6, 7, 8, 9]), k = R(4, 12), vrai = Math.random() < 0.5;

/* ---- génération d'une série ---- */
function enabledTpl(cat) { const f = getFlags(); return cat.tpl.filter(t => !f.tpl[t.id]); }
function makeQ(cat, tpl, usedKeys) {
  const f = getFlags();
  for (let i = 0; i < 60; i++) {
    const q = tpl.gen();
    const key = tpl.id + '|' + q.q;
    if (usedKeys.has(key) || f.q[key]) continue;
    usedKeys.add(key);
    q.cat = cat.id; q.tid = tpl.id; q.key = key;
    return q;
  }
  const q = tpl.gen(); q.cat = cat.id; q.tid = tpl.id; q.key = tpl.id + '|' + q.q; return q;
}
function catWeights() {
  const h = getHistory().slice(-12), w = {};
  for (const c of CATS) {
    let ok = 0, n = 0;
    for (const s of h) if (s.per[c.id]) { ok += s.per[c.id].ok; n += s.per[c.id].n; }
    w[c.id] = n === 0 ? 0.7 : Math.max(0.12, 1.1 - ok / n);
  }
  return w;
}
function genSeries(mode, catId) {
  const usable = CATS.filter(c => enabledTpl(c).length);
  if (!usable.length) return [];
  const used = new Set(), qs = [];
  let order = [];
  if (mode === 'cat') order = Array(10).fill(catId);
  else if (mode === 'mix') { order = shuffle(usable.map(c => c.id)).slice(0, 10); while (order.length < 10) order.push(pick(usable).id); order = shuffle(order); }
  else {
    const w = catWeights(), count = {};
    for (let i = 0; i < 10; i++) {
      let pool = usable.filter(c => (count[c.id] || 0) < 3), tot = pool.reduce((a, c) => a + w[c.id], 0), r = Math.random() * tot, ch = pool[pool.length - 1];
      for (const c of pool) { r -= w[c.id]; if (r <= 0) { ch = c; break; } }
      count[ch.id] = (count[ch.id] || 0) + 1; order.push(ch.id);
    }
  }
  const lastT = {}, usedT = {};
  for (const id of order) {
    const cat = catById(id), list = enabledTpl(cat);
    let cand = list.filter(t => !(usedT[id] || []).includes(t.id));
    if (!cand.length) { usedT[id] = []; cand = list.filter(t => t.id !== lastT[id]); if (!cand.length) cand = list; }
    const t = pick(cand);
    (usedT[id] = usedT[id] || []).push(t.id); lastT[id] = t.id;
    qs.push(makeQ(cat, t, used));
  }
  return qs;
}

function parseNum(s) {
  s = String(s).trim().replace(/[\s  ]/g, '').replace(',', '.').replace('−', '-');
  return /^-?\d+(\.\d+)?$/.test(s) ? parseFloat(s) : NaN;
}
function correct(q, input) {
  if (q.kind === 'choice' || q.kind === 'vf') return input === q.ans;
  const x = parseNum(input);
  if (isNaN(x)) return false;
  if (q.kind === 'range') return x > q.lo + 1e-12 && x < q.hi - 1e-12;
  return Math.abs(x - q.ans) < 1e-9;
}
function ansText(q) {
  if (q.kind === 'choice') return q.choices[q.ans];
  if (q.kind === 'vf') return q.ans ? 'Vrai' : 'Faux';
  if (q.kind === 'range') return 'par exemple ' + fmt((q.lo + q.hi) / 2);
  return fmt(q.ans) + (q.unit ? ' ' + q.unit : '');
}

async function ghFetch(method, body) {

    const res = await fetch(RELAY(), { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ method, body: body || null }), redirect: 'follow' });
    const j = await res.json();
    return { status: j.status, json: async () => j.data };
  }
  const c = syncCfg();
  return fetch('https://api.github.com/repos/' + encodeURIComponent(c.o) + '/' + encodeURIComponent(c.r) + '/contents/progress.json' + (method === 'GET' ? '?t=' + Date.now() : ''), {
    method, cache: 'no-store',
    headers: Object.assign({ Authorization: 'Bearer ' + c.t, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' }, body ? { 'Content-Type': 'application/json' } : {}),
    body: body ? JSON.stringify(body) : undefined,
  });
}
function mergeData(remote) {
  const lc = LS.get('clearedAt', 0), lf = LS.get('flagsT', 0);
  const clr = Math.max(lc, (remote && remote.clearedAt) || 0);
  const m = new Map();
  for (const e of getHistory().concat((remote && remote.history) || [])) if (e && e.t > clr && !m.has(e.t)) m.set(e.t, e);
  const hist = [...m.values()].sort((a, b) => a.t - b.t).slice(-300);
  const useRemote = remote && (remote.flagsT || 0) > lf && remote.flags;
  return { v: 1, history: hist, flags: useRemote ? remote.flags : getFlags(), flagsT: useRemote ? remote.flagsT : lf, clearedAt: clr };
}
let syncing = false, syncAgain = false, syncTimer = null;
function syncSoon() { if (noSync || !syncOn()) return; clearTimeout(syncTimer); syncTimer = setTimeout(syncNow, 600); }
async function syncNow() {
  if (!syncOn()) { setSy('off'); return; }
  if (syncing) { syncAgain = true; return; }
  syncing = true; setSy('busy');
  try {
    for (let k = 0; k < 3; k++) {
      const r = await ghFetch('GET');
      let remote = null, sha;
      if (r.status === 200) { const j = await r.json(); sha = j.sha; try { remote = JSON.parse(b64dec(j.content)); } catch (e) { remote = null; } }
      else if (r.status === 401 || r.status === 403) { setSy('auth', 'Le jeton est refusé (' + r.status + ').'); return; }
      else if (r.status !== 404) { setSy('off', 'Erreur GitHub ' + r.status); return; }
      const out = mergeData(remote);
      noSync = true; try { saveHistory(out.history); saveFlags(out.flags); LS.set('flagsT', out.flagsT); LS.set('clearedAt', out.clearedAt); } finally { noSync = false; }
      if (remote && JSON.stringify(remote.history) === JSON.stringify(out.history) && JSON.stringify(remote.flags) === JSON.stringify(out.flags) && (remote.clearedAt || 0) === out.clearedAt) { setSy('ok'); break; }
      const put = await ghFetch('PUT', Object.assign({ message: 'Progression ' + new Date().toISOString().slice(0, 16), content: b64enc(JSON.stringify(out)) }, sha ? { sha } : {}));
      if (put.status === 200 || put.status === 201) { setSy('ok'); break; }
      if ((put.status === 409 || put.status === 422) && k < 2) continue;
      setSy(put.status === 401 || put.status === 403 ? 'auth' : 'off', 'Écriture impossible (' + put.status + ').'); return;
    }
    if ((VIEW === 'home' || VIEW === 'progress') && !(S && S.view === 'question')) { const y = window.scrollY; render(VIEW); window.scrollTo(0, y); }
  } catch (e) { setSy('off', String(e && e.message || e)); }
  finally { syncing = false; if (syncAgain) { syncAgain = false; syncSoon(); } }
}

function groupPts(ents, mode) {

  for (const e of ents) { const k = mode === 'jour' ? dayStart(e.t) : weekStart(e.t); const g = m.get(k) || { t: k, ok: 0, n: 0 }; g.ok += e.ok; g.n += e.n; m.set(k, g); }
  return [...m.values()].sort((x, y) => x.t - y.t).map(g => ({ t: g.t, ok: g.ok, n: g.n, p: Math.round(100 * g.ok / g.n), lab: dm(g.t), tip: (mode === 'jour' ? 'Le ' : 'Semaine du ') + dm(g.t) }));
}

/* graphique : un point par série, reliés entre eux */
function chart(pts, w, hgt) {
  w = w || 320; hgt = hgt || 110;
  const L = 48, R = 12, B = 22, T = 10, W = w - L - R, H = hgt - B - T;
  const Y = v => T + H - H * v / 100;
  let svg = '<svg viewBox="0 0 ' + w + ' ' + hgt + '" class="chart" role="img" aria-label="Scores obtenus série après série">';
  [0, 25, 50, 75, 100].forEach(v => {
    svg += '<line x1="' + L + '" x2="' + (w - R) + '" y1="' + Y(v) + '" y2="' + Y(v) + '" class="grid' + (v % 50 ? ' faint' : '') + '"/>';
    if (v % 50 === 0) svg += '<text x="' + (L - 6) + '" y="' + (Y(v) + 4) + '" class="axis" text-anchor="end">' + v + ' %</text>';
  });
  if (!pts.length) return svg + '<text x="' + (w / 2) + '" y="' + (hgt / 2) + '" class="axis" text-anchor="middle">Pas encore de résultat</text></svg>';
  const vis = pts.slice(-30), m = vis.length, off = pts.length - m;
  const X = i => m === 1 ? L + W / 2 : L + W * i / (m - 1);
  if (m > 1) { let d = ''; vis.forEach((p, i) => { d += (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p.p).toFixed(1); }); svg += '<path d="' + d + '" class="line"/>'; }
  vis.forEach((p, i) => {
    svg += '<circle cx="' + X(i).toFixed(1) + '" cy="' + Y(p.p).toFixed(1) + '" r="4.5" class="dot"><title>' + esc(p.tip || ('Série ' + (off + i + 1))) + ' : ' + p.ok + '/' + p.n + ' (' + p.p + ' %)</title></circle>';
    const step = Math.ceil(m / (w > 400 ? 10 : 5));
    if (i === m - 1 || i % step === 0 && m - 1 - i >= step * 0.6 || m === 1) svg += '<text x="' + X(i).toFixed(1) + '" y="' + (hgt - 6) + '" class="axis" text-anchor="middle">' + esc(p.lab || (off + i + 1)) + '</text>';
  });
  return svg + '</svg>';
}

/* graphique « par jour / par semaine » : chaque série reste un point, regroupée par jour ou par semaine */

    avgs += '<line x1="' + (X(x0) - 6).toFixed(1) + '" x2="' + (X(x1) + 6).toFixed(1) + '" y1="' + Y(avg).toFixed(1) + '" y2="' + Y(avg).toFixed(1) + '" class="avg"><title>Moyenne : ' + avg + ' %</title></line>';
    if (bi) { const sx = (X(x0) - unit * GAP / 2 - 3).toFixed(1); seps += '<line x1="' + sx + '" x2="' + sx + '" y1="' + T + '" y2="' + (T + H) + '" class="sep"/>'; }

  if (!bs.length) return '';
  const MOIS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
  const NJ = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
  let h = '<div class="rlist"><h4>Détail ' + (mode === 'jour' ? 'jour par jour' : 'semaine par semaine') + '</h4>';
  bs.forEach(b => {
    const d = new Date(b.k), avg = Math.round(100 * b.ok / b.n);
    const title = mode === 'jour' ? NJ[d.getDay()] + ' ' + d.getDate() + ' ' + MOIS[d.getMonth()] : 'Semaine du lundi ' + d.getDate() + ' ' + MOIS[d.getMonth()];
    h += '<div class="rb"><div class="rbh"><b>' + title + '</b><span>' + b.list.length + ' série' + (b.list.length > 1 ? 's' : '') + ' · ' + b.n + ' questions · <b class="' + cls(avg) + '">' + avg + ' %</b></span></div><div class="chips">'
      + b.list.map(e => '<span class="chip ' + cls(e.p) + '"><i>' + (mode === 'jour' ? hm(e.t) : JOURS[new Date(e.t).getDay()] + ' ' + new Date(e.t).getDate()) + '</i> ' + e.ok + '/' + e.n + ' <small>' + e.p + ' %</small></span>').join('') + '</div></div>';
  });
  return h + '</div>';
}
function renderProgress() {
  const now = Date.now(), d0 = dayStart(now), w0 = weekStart(now), INF = Infinity;
  const per = [['Aujourd’hui', d0, INF], ['Cette semaine', w0, INF], ['Depuis le début', 0, INF]];
  const tot = per.map(([l, f, t]) => totals(null, f, t));
  const prev = totals(null, w0 - 7 * DAY, w0);
  let html = '<section class="hero big"><div class="deco" aria-hidden="true"><i>+</i><i>−</i><i>×</i><i>÷</i><i>=</i><i>%</i></div><h1>Ma progression</h1><p>Voici ton score aujourd’hui, cette semaine et depuis le début. Ce qui compte, c’est que la courbe monte peu à peu.</p><div class="row"><button class="btn primary" data-act="start" data-mode="weak">Travailler mes points faibles</button><button class="btn glass" data-act="home">Accueil</button></div></section>';
  html += '<div class="kpis">' + per.map(([l], i) => {
    const t = tot[i]; let extra = t.n ? t.ser + ' série' + (t.ser > 1 ? 's' : '') + ' · ' + t.n + ' questions' : 'Rien pour l’instant';
    if (i === 1 && t.n && prev.n) { const d = t.p - prev.p; extra += ' · ' + (d > 0 ? '▲ +' + d : d < 0 ? '▼ ' + d : '= ') + ' point' + (Math.abs(d) > 1 ? 's' : '') + ' vs sem. précédente'; }
    return '<div class="kpi"><span class="kl">' + l + '</span><span class="kv ' + cls(t.p) + '">' + (t.n ? t.p + ' %' : '—') + '</span><span class="kx">' + extra + '</span></div>';
  }).join('') + '</div>';
  if (PROF) html += syncCard();
  html += '<div class="seg" role="group" aria-label="Regrouper les points">' + [['serie', 'Série par série'], ['jour', 'Par jour'], ['sem', 'Par semaine']].map(([k, l]) => '<button class="segb' + (PERIOD === k ? ' on' : '') + '" data-act="period" data-p="' + k + '">' + l + '</button>').join('') + '</div>';
  const glob = groupPts(entsOf(null), PERIOD), unit = { serie: 'série', jour: 'jour', sem: 'semaine' }[PERIOD];
  html += '<div class="card big"><h3>Toutes les séries</h3>' + (PERIOD === 'serie' ? chart(glob, 600, 190) : chartG(entsOf(null), PERIOD, 600, 190)) + '<p class="meta">' + (glob.length ? glob.length + ' ' + unit + (glob.length > 1 ? 's' : '') + ' · dernier résultat : ' + glob[glob.length - 1].p + ' %' : 'Fais une première série pour voir ta courbe.') + '</p></div>' + (PERIOD === 'serie' ? '' : recapList(entsOf(null), PERIOD));
  html += '<h2 class="sec">Par thème</h2><div class="tw"><table class="recap ptab"><thead><tr><th>Thème</th>' + per.map(([l]) => '<th class="pc">' + l + '</th>').join('') + '</tr></thead><tbody>';
  CATS.forEach(c => { const cs = cst(c.id); html += '<tr class="cc" style="--h:' + cs.h + '"><td class="thn"><span class="ico sm">' + cs.ic + '</span>' + esc(c.nom) + '</td>' + per.map(([l, f, t]) => cell(totals(c.id, f, t))).join('') + '</tr>'; });
  html += '</tbody></table></div><p class="meta">Un pourcentage en gris vient de moins de 3 questions : il n’est pas encore très fiable.</p>';
  html += '<h2 class="sec">Évolution par thème</h2><div class="grid">';
  const st = catStats();
  CATS.forEach(c => {
    const pts = st[c.id], last = pts[pts.length - 1];
    const trend = pts.length >= 2 ? pts.slice(-4).map(p => p.p).join(' → ') + ' %' : '';
    const cs = cst(c.id);
    html += '<div class="card cc" style="--h:' + cs.h + '"><h3><span class="ico sm">' + cs.ic + '</span>' + esc(c.nom) + '</h3>' + (PERIOD === 'serie' ? chart(pts, 250, 140) : chartG(entsOf(c.id), PERIOD, 250, 140)) + '<p class="meta">' + (last ? pts.length + ' ' + unit + (pts.length > 1 ? 's' : '') + (trend ? ' · ' + trend : ' · ' + last.p + ' %') : 'Pas encore travaillé') + '</p>'
      + '<button class="btn small" data-act="start" data-mode="cat" data-cat="' + c.id + '">S’entraîner</button></div>';
  });
  html += '</div><div class="foot"><button class="link" data-act="resetask">Effacer ma progression</button><span id="resetbox"></span></div>';
  app.innerHTML = html;
}

function renderFlags() {
  const f = getFlags();
  const tpls = Object.entries(f.tpl), qs = Object.entries(f.q);
  let h = '<section class="hero"><h1>Signalements</h1><p>Mode professeur. Ces choix sont enregistrés dans ce navigateur et sur cet appareil. Pour que la correction vaille pour tous les élèves, copie le rapport et envoie-le moi : je modifierai le générateur.</p><div class="row"><button class="btn primary" data-act="copyreport">Copier le rapport</button><button class="btn ghost" data-act="home">Accueil</button><button class="btn ghost" data-act="profoff">Quitter le mode professeur</button></div><div id="copymsg" class="hint"></div></section>';
  h += '<h2 class="sec">Types de calculs désactivés (' + tpls.length + ')</h2>';
  h += tpls.length ? '<ul class="errs">' + tpls.map(([id, v]) => '<li><b>' + esc(v.nom || id) + '</b> <code>' + esc(id) + '</code><div>Exemple : ' + esc(v.ex || '') + '</div>' + (v.why ? '<div>Remarque : ' + esc(v.why) + '</div>' : '') + '<button class="btn small" data-act="unflagtpl" data-id="' + esc(id) + '">Réactiver</button></li>').join('') + '</ul>' : '<p class="hint">Aucun.</p>';
  h += '<h2 class="sec">Calculs précis retirés (' + qs.length + ')</h2>';
  h += qs.length ? '<ul class="errs">' + qs.map(([k, v]) => '<li><b>' + esc(v.text || k) + '</b> <code>' + esc(v.tid || '') + '</code>' + (v.why ? '<div>Remarque : ' + esc(v.why) + '</div>' : '') + '<button class="btn small" data-act="unflagq" data-key="' + esc(k) + '">Réactiver</button></li>').join('') + '</ul>' : '<p class="hint">Aucun.</p>';
  app.innerHTML = h;
}
function reportText() {
  const f = getFlags(), L = ['Rapport de signalements — calcul mental 5e', ''];
  for (const [id, v] of Object.entries(f.tpl)) L.push('TYPE DÉSACTIVÉ : ' + id + ' (' + (v.nom || '') + ') — exemple : ' + (v.ex || '') + (v.why ? ' — remarque : ' + v.why : ''));
  for (const [k, v] of Object.entries(f.q)) L.push('CALCUL RETIRÉ : ' + (v.tid || '') + ' — ' + (v.text || k) + (v.why ? ' — remarque : ' + v.why : ''));
  if (L.length === 2) L.push('(aucun signalement)');
  return L.join('\n');
}

function render(name) {
  stopTimer(); VIEW = name;
  if (name === 'home') renderHome();
  else if (name === 'question') renderQuestion();
  else if (name === 'result') renderResult();
  else if (name === 'progress') renderProgress();
  else if (name === 'flags') renderFlags();
  document.querySelectorAll('[data-nav]').forEach(b => b.classList.toggle('on', b.dataset.nav === name || (name === 'question' && b.dataset.nav === 'home')));
  const pb = $('#profbadge'); if (pb) pb.hidden = !PROF;
  setSy(SY.st, SY.msg);
  const fb = document.querySelector('[data-nav="flags"]'); if (fb) fb.hidden = !PROF;
  window.scrollTo(0, 0);
}

/* ---- actions ---- */
function startSeries(mode, catId) {
  const qs = genSeries(mode, catId);
  if (!qs.length) { app.innerHTML = '<section class="hero"><h1>Rien à proposer</h1><p>Tous les types de calcul de ce thème sont désactivés.</p><div class="row"><button class="btn" data-act="home">Accueil</button></div></section>'; return; }
  S = { mode, cat: catId, qs, i: 0, res: [], done: false, view: 'question' };
  render('question');
}
function answer(input) {
  if (!S || S.done) return;
  const q = S.qs[S.i];
  if (q.kind === 'vf') input = !!input;
  const ok = correct(q, input);
  S.res[S.i] = { ok, given: (q.kind === 'choice') ? q.choices[input] : (q.kind === 'vf' ? (input ? 'Vrai' : 'Faux') : String(input).trim()) };
  advance();
}
function advance() {
  if (S.i + 1 < S.qs.length) { S.i++; render('question'); } else finishSeries();
}
function finishSeries() {
  const per = {};
  S.res.forEach((r, i) => { const c = S.qs[i].cat; per[c] = per[c] || { ok: 0, n: 0 }; per[c].n++; if (r.ok) per[c].ok++; });
  const h = getHistory().concat([{ t: Date.now(), mode: S.mode, per }]);
  saveHistory(h.slice(-300));
  S.view = 'result'; render('result');
}

document.addEventListener('submit', e => {
  if (e.target.id === 'f') { e.preventDefault(); answer($('#inp').value); }
  if (e.target.id === 'flagform') { e.preventDefault(); confirmFlag(); }
});
function confirmFlag() {
  const q = S.qs[S.i], f = getFlags(), why = ($('#flagwhy') || {}).value || '', scope = (document.querySelector('input[name=fs]:checked') || {}).value || 'q';
  const t = tplById(q.tid);
  if (scope === 'tpl') f.tpl[q.tid] = { nom: t ? t.t.nom : q.tid, ex: plain(q.q), why, date: Date.now() };
  else f.q[q.key] = { tid: q.tid, text: plain(q.q), why, date: Date.now() };
  saveFlags(f);
  const box = $('#flagbox');
  if (!S.done) {
    // le calcul n'a pas été répondu : on le remplace par un autre du même thème
    const cat = catById(q.cat), list = enabledTpl(cat);
    if (list.length) { const used = new Set(S.qs.map(x => x.key)); S.qs[S.i] = makeQ(cat, pick(list), used); render('question'); const b = $('#flagbox'); if (b) b.innerHTML = '<p class="hint">Signalement enregistré. Le calcul a été remplacé.</p>'; return; }
  }
  if (box) box.innerHTML = '<p class="hint">Signalement enregistré. ' + (scope === 'tpl' ? 'Ce type de calcul' : 'Ce calcul') + ' ne sera plus proposé.</p>';
}

function inSeries() { return S && S.view === 'question'; }
function askLeave(go) {
  stopTimer();
  const m = document.createElement('div'); m.className = 'modal'; m.setAttribute('role', 'dialog'); m.setAttribute('aria-modal', 'true');
  m.innerHTML = '<div class="mbox"><h3>Quitter la série ?</h3><p>Ta série n’est pas terminée : si tu quittes maintenant, elle ne sera pas enregistrée.</p><div class="row"><button class="btn primary" id="mStay">Continuer la série</button><button class="btn danger" id="mLeave">Quitter</button></div></div>';
  document.body.appendChild(m);
  $('#mStay').focus();
  $('#mStay').onclick = () => { m.remove(); startTimer(); const i = $('#inp'); if (i) i.focus(); };
  $('#mLeave').onclick = () => { m.remove(); go(); };
}
window.addEventListener('beforeunload', e => { if (inSeries()) { e.preventDefault(); e.returnValue = ''; } });
document.addEventListener('change', e => {
  if (e.target.id === 'tmOn') { TM.on = e.target.checked; saveTM(); const sel = $('#tmSec'); if (sel) sel.disabled = !TM.on; }
  if (e.target.id === 'tmSec') { TM.sec = parseInt(e.target.value, 10); saveTM(); }
});
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act],[data-nav]'); if (!b) return;
  if (inSeries() && (b.dataset.nav || ['home', 'progress'].includes(b.dataset.act))) { askLeave(() => { S = null; if (b.dataset.nav) render(b.dataset.nav); else render(b.dataset.act); }); return; }
  if (b.dataset.nav) { if (b.dataset.nav === 'home') { S = null; render('home'); } else render(b.dataset.nav); return; }
  const a = b.dataset.act;
  if (a === 'start') startSeries(b.dataset.mode, b.dataset.cat);
  else if (a === 'again') startSeries(S.mode, S.cat);
  else if (a === 'home') { S = null; render('home'); }
  else if (a === 'progress') render('progress');
  else if (a === 'period') { PERIOD = b.dataset.p; LS.set('period', PERIOD); render('progress'); }
  else if (a === 'pick') answer(parseInt(b.dataset.k, 10));
  else if (a === 'next') { if (S.i + 1 < S.qs.length) { S.i++; S.done = false; render('question'); } else finishSeries(); }
  else if (a === 'flag') {
    $('#flagbox').innerHTML = '<form id="flagform" class="flagform"><label><input type="radio" name="fs" value="q" checked> Ne plus proposer exactement ce calcul</label>'
      + '<label><input type="radio" name="fs" value="tpl"> Ne plus proposer ce type de calcul (« ' + esc(tplById(S.qs[S.i].tid).t.nom) + ' »)</label>'
      + '<input id="flagwhy" placeholder="Remarque (facultatif) : mal formulé, trop difficile de tête…"><div class="row"><button class="btn primary" type="submit">Signaler</button><button class="btn ghost" type="button" data-act="flagcancel">Annuler</button></div></form>';
  }
  else if (a === 'flagcancel') $('#flagbox').innerHTML = '';
  else if (a === 'unflagtpl') { const f = getFlags(); delete f.tpl[b.dataset.id]; saveFlags(f); render('flags'); }
  else if (a === 'unflagq') { const f = getFlags(); delete f.q[b.dataset.key]; saveFlags(f); render('flags'); }
  else if (a === 'copyreport') {
    const txt = reportText();
    const done = ok => { const m = $('#copymsg'); if (m) m.textContent = ok ? 'Rapport copié : colle-le dans la conversation.' : 'Copie impossible : sélectionne et copie le texte ci-dessous.'; if (!ok && m) m.insertAdjacentHTML('afterend', '<textarea class="rep" readonly rows="8">' + esc(txt) + '</textarea>'); };
    try { navigator.clipboard.writeText(txt).then(() => done(true), () => done(false)); } catch (err) { done(false); }
  }
  else if (a === 'profoff') { PROF = false; LS.del('prof'); render('home'); }
  else if (a === 'resetask') $('#resetbox').innerHTML = ' Sûr(e) ? <button class="btn small danger" data-act="resetyes">Oui, tout effacer</button> <button class="link" data-act="resetno">Non</button>';
  else if (a === 'resetno') $('#resetbox').innerHTML = '';
  else if (a === 'resetyes') { LS.set('clearedAt', Date.now()); saveHistory([]); render('progress'); }
  else if (a === 'syncsave') { const t = ($('#syT') || {}).value || '', o = ($('#syO') || {}).value || '', r = ($('#syR') || {}).value || ''; if (t.trim() && o.trim() && r.trim()) { LS.set('token', t.trim()); LS.set('syOwner', o.trim()); LS.set('syRepo', r.trim()); setSy('busy'); render('progress'); syncNow(); } }
  else if (a === 'syncnow') syncNow();
  else if (a === 'synclink') {
    const link = location.origin + location.pathname + '#sync=' + syncCfg().t, m = $('#synclinkmsg');
    const done = ok => { if (m) m.innerHTML = ok ? 'Lien copié. Ouvre-le sur l’autre appareil (il active la sauvegarde puis disparaît de la barre d’adresse).' : 'Copie impossible : <textarea class="rep" readonly rows="3">' + esc(link) + '</textarea>'; };
    try { navigator.clipboard.writeText(link).then(() => done(true), () => done(false)); } catch (err) { done(false); }
  }
  else if (a === 'histcopy') {
    const txt = JSON.stringify(getHistory()), m = $('#histmsg');
    const ok = () => { if (m) m.textContent = getHistory().length + ' série(s) copiée(s).'; };
    try { navigator.clipboard.writeText(txt).then(ok, () => { if (m) m.innerHTML = 'Copie impossible : <textarea class="rep" readonly rows="3">' + esc(txt) + '</textarea>'; }); } catch (err) {}
  }
  else if (a === 'histimp') {
    const m = $('#histmsg'); let arr;
    try { arr = JSON.parse($('#histbox').value); if (!Array.isArray(arr)) throw 0; } catch (err) { if (m) m.textContent = 'Contenu non reconnu.'; return; }
    const seen = new Set(getHistory().map(e => e.t)); let n = 0; const all = getHistory().slice();
    for (const e of arr) if (e && typeof e.t === 'number' && e.per && typeof e.per === 'object' && !seen.has(e.t)) { all.push(e); seen.add(e.t); n++; }
    all.sort((x, y) => x.t - y.t); saveHistory(all); render('progress');
    const m2 = $('#histmsg'); if (m2) m2.textContent = n + ' série(s) importée(s).';
  }
  else if (a === 'syncoff') { LS.del('token'); setSy('off'); render('progress'); }
});

document.addEventListener('keydown', e => {
  // Entrée sur « question suivante » est géré par le bouton ; ici : raccourcis pour Vrai/Faux
  if (!S || S.view !== 'question' || S.done) return;
  const q = S.qs[S.i];
  if (q.kind === 'vf' || q.kind === 'choice') { if (e.key === '1' || e.key === '2') { const btn = document.querySelectorAll('.choice')[parseInt(e.key, 10) - 1]; if (btn) btn.click(); } }
});

window.CM = { groupPts, totals, weekStart, dayStart, CATS, genSeries, correct, parseNum, fmt, getHistory, saveHistory, getFlags, saveFlags, syncNow, startSeries, answer, get S() { return S; } };
render('home');
syncNow();
</script></body></html>
